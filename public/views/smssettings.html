  <div class="card settings-section">
  <h4>Enable/Disable Features</h4>
  <small class="form-text text-muted">Available Variables are(where appliable):<span>{clientName}</span>, <span>{transactionDate}</span>, <span>{accountType}</span>, <span>{accountNo}</span>, <span>{accountBalance}</span>, <span>{companyName}</span> and <span>{transactionAmount}</span></small>


  <div class="form-check" ng-repeat="feature in settings.features">
    <input type="checkbox"
           class="form-check-input"
           id="feature-{{$index}}"
           ng-model="feature.enabled">
    <label class="form-check-label" for="feature-{{$index}}">
      {{feature.label}}
    </label>
     <h4>{{feature.label }} Message Template (Default)</h4>
     <select ng-options="(feature.templates.indexOf(f)+1) +'. '+f.slice(0,40) for f in feature.templates" ng-model="feature.template"></select>
     <button class="pill btn-primary pull-right " ng-click="saveTemplate(feature)" ng-show="feature.template"> save</button>
     <button class="pill btn-primary pull-right " ng-click="removeTemplate(feature)" ng-show="feature.template"> remove</button>
          <button class="pill pull-right " ng-click="reset(feature)" ng-show="!feature.template"> default</button>

    <textarea class="form-control" ng-model="feature.template" rows="3" placeholder="{{feature.defaultTemplate}}"></textarea>
    
  </div>

        <input type="number" class="form-control" ng-model="settings.rateLimit" min="1" max="1000">
      </div>
      <div class="form-group col-md-6">
        <label>Retry on Failure</label>
        <select class="form-control" ng-model="settings.retryPolicy">
          <option value="none">None</option>
          <option value="simple">Simple Retry</option>
          <option value="exponential">Exponential Backoff</option>
        </select>
      </div>
    </div>
